name: Sports Facility Booking CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build frontend and backend
    runs-on: self-hosted

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build backend
        shell: bash
        working-directory: backend
        run: |
          chmod +x ./mvnw
          ./mvnw -DskipTests package

      - name: Install frontend dependencies
        shell: bash
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        shell: bash
        working-directory: frontend
        run: npm run build
