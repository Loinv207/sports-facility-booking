name: Sports Facility Booking Docker Compose

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

jobs:
  compose:
    name: Build and deploy with Docker Compose
    runs-on: self-hosted

    env:
      COMPOSE_BAKE: "false"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Detect Docker Compose
        id: compose
        shell: bash
        run: |
          if docker compose version >/dev/null 2>&1; then
            echo "cmd=docker compose" >> "$GITHUB_OUTPUT"
          elif command -v docker-compose >/dev/null 2>&1; then
            echo "cmd=docker-compose" >> "$GITHUB_OUTPUT"
          else
            echo "Docker Compose is not installed on this runner." >&2
            exit 1
          fi

      - name: Free Docker disk space
        shell: bash
        run: |
          echo "Disk before cleanup:"
          df -h
          docker system df || true

          docker container prune -f || true
          docker image prune -af || true
          docker builder prune -af || true
          docker network prune -f || true

          echo "Disk after cleanup:"
          df -h
          docker system df || true

      - name: Validate compose file
        shell: bash
        run: ${{ steps.compose.outputs.cmd }} config --quiet

      - name: Build compose images
        shell: bash
        run: ${{ steps.compose.outputs.cmd }} build --no-cache

      - name: Deploy compose stack
        if: github.event_name != 'pull_request'
        shell: bash
        run: ${{ steps.compose.outputs.cmd }} up -d --remove-orphans

      - name: Show compose status
        if: always() && github.event_name != 'pull_request'
        shell: bash
        run: ${{ steps.compose.outputs.cmd }} ps

      - name: Show compose logs on failure
        if: failure()
        shell: bash
        run: ${{ steps.compose.outputs.cmd }} logs --tail=120
