services:
  db:
    image: mysql:8.4
    container_name: sports-booking-db
    environment:
      MYSQL_DATABASE: sports_now
      MYSQL_USER: sportsadmin
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-sportsbooking}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - sports-booking-db-data:/var/lib/mysql
    networks:
      - sports-booking-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sports-booking-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/sports_now?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: sportsadmin
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-sportsbooking}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sports-booking-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sports-booking-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - sports-booking-network

networks:
  sports-booking-network:
    driver: bridge

volumes:
  sports-booking-db-data:
